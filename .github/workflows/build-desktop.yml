name: Build Cross-Platform Desktop Installers (Windows .exe & Fedora .rpm)

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-windows:
    name: Build Windows Installer (.exe & .msi)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend production assets
        run: npm run build

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2.0.0" --locked

      - name: Build Windows Executable (.exe & .msi)
        run: cargo tauri build --bundles nsis,msi

      - name: Upload Windows Artifacts (.exe)
        uses: actions/upload-artifact@v4
        with:
          name: Windows-x64-Installer-EXE
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi

  build-fedora-and-linux:
    name: Build Fedora RPM (.rpm) & Linux AppImage
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux build dependencies & rpmbuild
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            rpm

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend production assets
        run: npm run build

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2.0.0" --locked

      - name: Build Fedora RPM and Linux AppImage
        run: cargo tauri build --bundles rpm,appimage

      - name: Upload Fedora RPM Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Fedora-x86_64-Package-RPM
          path: src-tauri/target/release/bundle/rpm/*.rpm

      - name: Upload Linux AppImage Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Linux-Universal-AppImage
          path: src-tauri/target/release/bundle/appimage/*.AppImage
